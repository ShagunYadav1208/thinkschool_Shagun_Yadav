name: Deploy frontend to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - "day-17/piece1/quotes-list-detail/**"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "day-17/piece1/quotes-list-detail/**"

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # AZURE_STATIC_WEB_APPS_API_TOKEN is a per-app deployment token, not an
      # Azure credential - it can only push content to this one Static Web
      # App, nothing else. See infra/deploy.md step 4 for how it's issued.
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "day-17/piece1/quotes-list-detail"
          output_location: "dist/quotes-list-detail/browser"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close pull request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
