name: Day 3 Piece 6 SQL Server Integration Tests

on:
  pull_request:
    paths:
      - "thinkschool_Shagun_Yadav/day-3/piece6/**"
  push:
    paths:
      - "thinkschool_Shagun_Yadav/day-3/piece6/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # ubuntu-latest ships Docker pre-installed and running, which is all
      # Testcontainers.MsSql needs to pull and start the SQL Server 2022
      # container. First run on a cold cache pulls the image (~5 min);
      # actions/cache keys the layer cache so later runs reuse it.
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: mssql-2022-image-${{ runner.os }}
      - name: Restore cached SQL Server image
        run: |
          if [ -f /tmp/docker-cache/mssql-2022.tar ]; then
            docker load -i /tmp/docker-cache/mssql-2022.tar
          fi
      - run: dotnet test thinkschool_Shagun_Yadav/day-3/piece6
      - name: Save SQL Server image to cache
        if: always()
        run: |
          mkdir -p /tmp/docker-cache
          docker save mcr.microsoft.com/mssql/server:2022-latest -o /tmp/docker-cache/mssql-2022.tar
