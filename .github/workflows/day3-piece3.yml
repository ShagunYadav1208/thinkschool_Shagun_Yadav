name: Day 3 Piece 3 Auth Tests

on:
  pull_request:
    paths:
      - "thinkschool_Shagun_Yadav/day-3/piece3/**"
  push:
    paths:
      - "thinkschool_Shagun_Yadav/day-3/piece3/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test thinkschool_Shagun_Yadav/day-3/piece3
